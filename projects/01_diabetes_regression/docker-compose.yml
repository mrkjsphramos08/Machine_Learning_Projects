version: '3.8'

services:
  model-api:
    build:
      context: ../..
      dockerfile: projects/01_diabetes_regression/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../mlflow.db:/app/mlflow.db:ro
      - ../../mlruns:/app/mlruns:ro
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    restart: unless-stopped
