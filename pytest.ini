[pytest]
# No `testpaths` on purpose: `pytest` from the repo root collects every project,
# while `pytest` from inside a project folder collects just that project.

# importlib mode derives a unique module name per test file path, so two
# projects may both ship a tests/test_pipeline.py without clashing. Each
# project's conftest.py is responsible for putting its own `src` package on
# sys.path (importlib mode deliberately does not modify sys.path).
addopts = --import-mode=importlib -ra
